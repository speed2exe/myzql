name: Compilation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zig: [master, "0.17.1"]
    steps:
      - uses: actions/checkout@v4
      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Build for Ubuntu
        run: |
          zig build

      - name: Build for Windows GNU
        run: |
          zig build -Dtarget=x86_64-windows-gnu
