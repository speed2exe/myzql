name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Run Integration Tests - MySQL
        run: |
          docker run --name mysql_server --env MYSQL_ROOT_PASSWORD=password -p 3306:3306 -d mysql:8.0 --default-authentication-plugin=mysql_native_password
          timeout 120 bash -c 'until docker logs mysql_server 2>&1 | grep -q "ready for connections"; do sleep 1; done'
          zig build integration_test -Dskip-stress=true --summary all
          rm -rf .zig-cache/ zig-out/

      - name: Run Integration Tests - MySQL Unix Socket
        run: |
          docker rm -f mysql_server
          mkdir -p /tmp/mysql
          docker run --name mysql_server_unix --env MYSQL_ROOT_PASSWORD=password -v /tmp/mysql:/var/run/mysqld -d mysql:8.0 --default-authentication-plugin=mysql_native_password
          while ! test -S /tmp/mysql/mysqld.sock; do sleep 1; done
          zig build integration_test -Dunix-socket-path=/tmp/mysql/mysqld.sock -Dtest-filter="unix socket" --summary all
          rm -rf .zig-cache/ zig-out/

      - name: Run Integration Tests - MariaDB
        run: |
          docker rm -f mysql_server_unix
          docker run --name some-mariadb --env MARIADB_ROOT_PASSWORD=password -p 3306:3306 -d mariadb
          timeout 120 bash -c 'until docker logs some-mariadb 2>&1 | grep -q "ready for connections"; do sleep 1; done'
          zig build integration_test -Dskip-stress=true --summary all
          rm -rf .zig-cache/ zig-out/

  auth-switch-repro:
    # Reproducer for the AUTH_SWITCH_REQUEST bug: mysql:8.0 with its DEFAULT
    # authentication plugin (caching_sha2_password) + an account created with
    # mysql_native_password forces the server to send an AuthSwitchRequest (0xFE),
    # which unfixed myzql mishandles (error.UnexpectedPacket / packets out of order).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Run Auth Switch Repro - MySQL (default caching_sha2_password)
        run: |
          docker run --name mysql_server_authswitch --env MYSQL_ROOT_PASSWORD=password -p 3306:3306 -d mysql:8.0
          timeout 120 bash -c 'until docker logs mysql_server_authswitch 2>&1 | grep -q "ready for connections"; do sleep 1; done'
          zig build integration_test -Dskip-stress=true -Dtest-filter="auth switch" --summary all
          rm -rf .zig-cache/ zig-out/
